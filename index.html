<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Buku Keluarga</title>
<style>
  :root{
    --ink:#20281f;
    --paper:#f6f1e4;
    --paper-line:#e2d6b8;
    --gold:#b8862f;
    --gold-deep:#8c631f;
    --indigo:#28374d;
    --maroon:#7a2e2e;
    --green:#3c5a3e;
    --green-light:#eef1e6;
    --card:#fffdf7;
    --muted:#6f6a58;
    --danger:#a13e3e;
    --radius:14px;
    --shadow:0 2px 10px rgba(32,40,31,.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--paper);
    background-image:
      repeating-linear-gradient(180deg, transparent, transparent 27px, var(--paper-line) 28px);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:84px;
  }
  .display{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;}
  .mono{font-variant-numeric:tabular-nums;font-family:"SF Mono",Menlo,Consolas,monospace;}

  header{
    padding:22px 20px 14px;
    position:sticky;top:0;z-index:5;
    background:linear-gradient(180deg, var(--paper) 78%, transparent);
  }
  header .brand{display:flex;align-items:baseline;gap:8px;}
  header .brand .mark{
    width:34px;height:34px;border-radius:8px;
    background:var(--indigo);color:var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:Georgia,serif;font-weight:700;font-size:16px;
    box-shadow:var(--shadow);
    flex-shrink:0;
  }
  header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.2px;}
  header p.tag{margin:2px 0 0;color:var(--muted);font-size:12.5px;}

  main{padding:6px 16px 20px;max-width:640px;margin:0 auto;}

  .card{
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px;
    margin-bottom:14px;
  }
  .card h2{
    font-size:12px;text-transform:uppercase;letter-spacing:1px;
    color:var(--gold-deep);margin:0 0 10px;font-weight:700;
  }

  .balance-hero{
    background:var(--indigo);
    color:var(--paper);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:14px;
    position:relative;
    overflow:hidden;
  }
  .balance-hero::after{
    content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;
    border:1px solid rgba(184,134,47,.35);border-radius:50%;
  }
  .balance-hero::before{
    content:"";position:absolute;right:10px;bottom:-40px;width:90px;height:90px;
    border:1px solid rgba(184,134,47,.25);border-radius:50%;
  }
  .balance-hero .label{font-size:12px;color:#c9d3e0;text-transform:uppercase;letter-spacing:1.2px;}
  .balance-hero .amount{font-family:Georgia,serif;font-size:32px;font-weight:700;margin-top:4px;color:#fdf8ec;}
  .balance-hero .grid{display:flex;gap:18px;margin-top:16px;position:relative;z-index:1;}
  .balance-hero .grid div{flex:1;}
  .balance-hero .grid .k{font-size:10.5px;color:#a9b6c9;text-transform:uppercase;letter-spacing:.8px;}
  .balance-hero .grid .v{font-family:Georgia,serif;font-size:17px;margin-top:2px;color:#fdf8ec;}

  .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--paper-line);}
  .row:last-child{border-bottom:none;}
  .row .left{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .row .left .t{font-weight:600;font-size:14.5px;}
  .row .left .s{font-size:12px;color:var(--muted);}
  .row .amt{font-weight:700;font-size:14.5px;white-space:nowrap;padding-left:10px;}
  .amt.in{color:var(--green);}
  .amt.out{color:var(--danger);}
  .empty{color:var(--muted);font-size:13px;padding:14px 0;text-align:center;}

  .pill{
    display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;
    background:var(--green-light);color:var(--green);font-weight:600;
  }
  .pill.due{background:#f6e6d8;color:var(--gold-deep);}

  button{font-family:inherit;cursor:pointer;}
  .btn{
    background:var(--indigo);color:var(--paper);border:none;border-radius:10px;
    padding:11px 16px;font-size:14px;font-weight:600;
  }
  .btn.gold{background:var(--gold);color:#2b1e08;}
  .btn.ghost{background:transparent;color:var(--indigo);border:1px solid var(--indigo);}
  .btn.small{padding:7px 12px;font-size:12.5px;border-radius:8px;}
  .btn.block{width:100%;}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
  .action-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .action-row .btn{min-width:68px;}
  .row-main{flex:1;min-width:0;}
  .row-actions{
    display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;
    width:100%;
  }
  .row-actions .btn{
    padding:7px 11px;font-size:12px;display:inline-flex;
    align-items:center;justify-content:center;min-height:34px;
  }
  .admin-actions{
    display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;
  }
  .admin-actions .btn{
    display:inline-flex;align-items:center;justify-content:center;
    min-height:34px;
  }

  .fab{
    position:fixed;right:18px;bottom:96px;z-index:20;
    width:54px;height:54px;border-radius:50%;
    background:var(--gold);color:#2b1e08;border:none;
    font-size:26px;box-shadow:0 4px 14px rgba(140,99,31,.4);
    display:flex;align-items:center;justify-content:center;
  }

  nav.tabbar{
    position:fixed;bottom:0;left:0;right:0;z-index:15;
    background:var(--card);border-top:1px solid var(--paper-line);
    display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  nav.tabbar button{
    flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--muted);font-size:10.5px;padding:6px 2px;border-radius:10px;
  }
  nav.tabbar button.active{color:var(--indigo);font-weight:700;background:var(--green-light);}
  nav.tabbar button .ic{font-size:18px;}

  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;}
  .field input, .field select, .field textarea{
    width:100%;padding:10px 12px;border:1px solid var(--paper-line);border-radius:9px;
    font-size:15px;background:#fffefb;color:var(--ink);font-family:inherit;
  }
  .seg{display:flex;border:1px solid var(--paper-line);border-radius:9px;overflow:hidden;}
  .seg button{flex:1;padding:10px;background:#fffefb;border:none;font-size:13.5px;font-weight:600;color:var(--muted);}
  .seg button.on.in{background:var(--green-light);color:var(--green);}
  .seg button.on.out{background:#f7e9e9;color:var(--danger);}

  .sheet-overlay{
    position:fixed;inset:0;background:rgba(32,40,31,.45);z-index:30;
    display:flex;align-items:flex-end;
  }
  .sheet{
    background:var(--paper);width:100%;border-radius:20px 20px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    max-height:88vh;overflow-y:auto;
    animation:up .18s ease-out;
  }
  @keyframes up{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
  .sheet h3{margin:0 0 14px;font-family:Georgia,serif;font-size:19px;}
  .sheet-actions{display:flex;gap:10px;margin-top:6px;}
  .sheet-actions .btn{flex:1;}
  .close-x{position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;color:var(--muted);}

  .member-chip{
    display:inline-flex;align-items:center;gap:6px;background:var(--green-light);color:var(--green);
    padding:5px 10px;border-radius:20px;font-size:12.5px;font-weight:600;margin:0 6px 6px 0;
  }
  .avatar{
    width:32px;height:32px;border-radius:50%;background:var(--gold);color:#2b1e08;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;
  }
  .member-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--paper-line);}
  .member-row:last-child{border-bottom:none;}
  .member-row .info{flex:1;min-width:0;}
  .member-row .info .n{font-weight:600;font-size:14.5px;}
  .member-row .info .b{font-size:12.5px;color:var(--muted);}

  .loading{display:flex;align-items:center;justify-content:center;padding:60px 0;color:var(--muted);font-size:13px;}
  .shared-note{font-size:11.5px;color:var(--muted);text-align:center;margin:4px 0 14px;}

  .arisan-order{display:flex;overflow-x:auto;gap:10px;padding:4px 2px 10px;}
  .arisan-order .stop{
    flex-shrink:0;width:88px;text-align:center;background:var(--card);border:1px solid var(--paper-line);
    border-radius:12px;padding:10px 6px;
  }
  .arisan-order .stop.done{background:var(--green-light);border-color:var(--green);}
  .arisan-order .stop .num{font-size:10px;color:var(--muted);}
  .arisan-order .stop .nm{font-size:12.5px;font-weight:700;margin-top:3px;}
  .arisan-order .stop .st{font-size:10px;margin-top:4px;}

  .pay-chip{
    display:flex;align-items:center;justify-content:space-between;background:#fffefb;
    border:1px solid var(--paper-line);border-radius:9px;padding:8px 10px;margin-bottom:6px;font-size:13px;
  }
  .toggle{
    width:38px;height:22px;border-radius:20px;background:#e2d6b8;position:relative;border:none;flex-shrink:0;
  }
  .toggle.on{background:var(--green);}
  .toggle .dot{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;}
  .toggle.on .dot{left:18px;}

  select#arisanTargetMonth, .filter-select{
    padding:8px 10px;border:1px solid var(--paper-line);border-radius:8px;font-size:12.5px;background:#fffefb;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark">BK</div>
    <div>
      <h1>Buku Keluarga</h1>
      <p class="tag">Kas · Tabungan · Arisan</p>
    </div>
  </div>
  <div id="authBox" style="margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--paper-line);border-radius:12px;padding:10px 12px;">
    <span style="color:var(--muted);font-size:13px;">Memeriksa akses…</span>
  </div>
</header>

<main id="main">
  <div class="loading">Memuat data…</div>
</main>

<button class="fab" id="fab">+</button>

<nav class="tabbar">
  <button data-tab="ringkasan" class="active"><span class="ic">🏠</span>Ringkasan</button>
  <button data-tab="kas"><span class="ic">📒</span>Kas</button>
  <button data-tab="tabungan"><span class="ic">🐖</span>Tabungan</button>
  <button data-tab="arisan"><span class="ic">🔄</span>Arisan</button>
  <button data-tab="anggota"><span class="ic">👪</span>Anggota</button>
</nav>

<div id="sheetRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ================= SUPABASE =================
  const SUPABASE_URL = 'https://ouhvoggkffpgywldjywk.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable__BvfW_8qaolHCuu9yJgtVQ_kLozf14v';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  const APP_DATA_ID = 1;
  let DATA = null;
  let currentTab = 'ringkasan';
  let session = null;
  let isAdmin = false;

  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function rupiah(n){ n=Number(n)||0; return 'Rp'+n.toLocaleString('id-ID'); }
  function todayStr(){ return new Date().toISOString().slice(0,10); }
  function fmtDate(d){
    try{return new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});}
    catch(e){return d;}
  }
  function initials(name){
    return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  }
  function escapeHtml(s){
    return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- FORMAT NOMINAL ----------
  function formatNominal(value){
    const digits=String(value??'').replace(/\D/g,'');
    if(!digits)return '';
    return Number(digits).toLocaleString('id-ID');
  }

  function parseNominal(value){
    const digits=String(value??'').replace(/\D/g,'');
    return Number(digits)||0;
  }

  function bindNominalInput(id){
    const input=document.getElementById(id);
    if(!input)return;
    input.type='text';
    input.inputMode='numeric';
    input.addEventListener('input',()=>{
      const start=input.selectionStart;
      const before=String(input.value).slice(0,start);
      const digitCount=(before.match(/\d/g)||[]).length;
      input.value=formatNominal(input.value);
      let pos=0,count=0;
      while(pos<input.value.length && count<digitCount){
        if(/\d/.test(input.value[pos]))count++;
        pos++;
      }
      input.setSelectionRange(pos,pos);
    });
    input.value=formatNominal(input.value);
  }

  function defaultData(){
    return {members:[],kas:[],tabungan:[],arisan:{contribution:0,order:[],rounds:[]}};
  }

  // ---------- AUTH ----------
  async function refreshAuth(){
    try{
      const {data:{session:s}, error:sessionError} =
        await supabaseClient.auth.getSession();

      if(sessionError) throw sessionError;

      session = s || null;
      isAdmin = false;

      if(session?.user){
        // Primary method: RPC created in Supabase.
        const {data:rpcAdmin, error:rpcError} =
          await supabaseClient.rpc('is_current_user_admin');

        console.log('Admin RPC:', rpcAdmin, rpcError);

        if(!rpcError && rpcAdmin === true){
          isAdmin = true;
        }else{
          // Fallback: read the current user's profile directly.
          // This makes the client resilient if the RPC is missing,
          // returns an error, or has a different return type.
          const {data:profile, error:profileError} =
            await supabaseClient
              .from('profiles')
              .select('is_admin')
              .eq('id', session.user.id)
              .maybeSingle();

          console.log('Admin profile:', profile, profileError);

          if(!profileError && profile?.is_admin === true){
            isAdmin = true;
          }
        }
      }

      updateAuthUI();
      return true;

    }catch(err){
      console.error('refreshAuth error:', err);
      session = null;
      isAdmin = false;
      updateAuthUI();
      return false;
    }
  }

  function updateAuthUI(){
    const box=document.getElementById('authBox');
    if(!box) return;

    if(session?.user){
      box.innerHTML = isAdmin
        ? `<span>🔐 <b>Admin aktif</b></span>
           <button class="btn ghost small" id="logoutBtn">Keluar Admin</button>`
        : `<span>👤 ${escapeHtml(session.user.email||'Pengguna')}</span>
           <button class="btn ghost small" id="logoutBtn">Keluar</button>`;

      document.getElementById('logoutBtn')?.addEventListener('click',logout);
    }else{
      box.innerHTML =
        `<span style="color:var(--muted);font-size:13px;">Mode lihat</span>
         <button class="btn ghost small" id="loginBtn">🔐 Login Admin</button>`;

      document.getElementById('loginBtn')?.addEventListener('click',sheetLogin);
    }

    const fab=document.getElementById('fab');
    if(fab) fab.style.display=isAdmin?'flex':'none';

    if(DATA) render();
  }

  async function logout(){
    try{
      const {error}=await supabaseClient.auth.signOut();
      if(error) console.error('Logout error:',error);
    }finally{
      session=null;
      isAdmin=false;
      updateAuthUI();
      alert('Berhasil keluar dari Admin.');
    }
  }

  function sheetLogin(){
    openSheet(`
      <h3>Login Admin</h3>
      <div class="field">
        <label>Email</label>
        <input type="email" id="loginEmail"
               placeholder="admin@gmail.com"
               autocomplete="email">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPassword"
               placeholder="Password"
               autocomplete="current-password">
      </div>
      <div class="sheet-actions">
        <button class="btn ghost" id="cancelLogin">Batal</button>
        <button class="btn gold" id="doLogin">Login</button>
      </div>
      <p style="font-size:11.5px;color:var(--muted);margin-top:10px;">
        Gunakan akun yang sudah dibuat di Supabase Authentication.
      </p>
    `);

    document.getElementById('cancelLogin')?.addEventListener('click',closeSheet);

    document.getElementById('doLogin')?.addEventListener('click',async()=>{
      const email=document.getElementById('loginEmail')?.value.trim();
      const password=document.getElementById('loginPassword')?.value;
      const btn=document.getElementById('doLogin');

      if(!email||!password){
        alert('Email dan password wajib diisi.');
        return;
      }

      btn.disabled=true;
      btn.textContent='Memproses...';

      try{
        const {data,error}=await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

        if(error) throw error;

        // Use the returned session immediately instead of waiting for
        // the auth event to update the UI.
        session=data?.session || null;

        await refreshAuth();

        if(!isAdmin){
          await supabaseClient.auth.signOut();
          session=null;
          isAdmin=false;
          updateAuthUI();

          alert('Akun berhasil login, tetapi belum memiliki hak Admin. Periksa profiles.is_admin untuk UID akun ini.');
          return;
        }

        closeSheet();
        await loadData();
        render();
        alert('Login Admin berhasil.');

      }catch(err){
        console.error('Login error:',err);
        alert('Login gagal: '+(err?.message || 'Kesalahan tidak diketahui.'));
      }finally{
        if(btn){
          btn.disabled=false;
          btn.textContent='Login';
        }
      }
    });
  }

  // ---------- DATA SUPABASE ----------
  async function loadData(){
    const main=document.getElementById('main');

    if(main){
      main.innerHTML='<div class="loading">Memuat data…</div>';
    }

    try{
      const {data,error}=await supabaseClient
        .from('app_data')
        .select('data')
        .eq('id',APP_DATA_ID)
        .maybeSingle();

      if(error) throw error;

      DATA = data?.data
        ? (typeof data.data==='string' ? JSON.parse(data.data) : data.data)
        : defaultData();

      if(!DATA || typeof DATA!=='object'){
        DATA=defaultData();
      }

      if(!Array.isArray(DATA.members)) DATA.members=[];
      if(!Array.isArray(DATA.kas)) DATA.kas=[];
      if(!Array.isArray(DATA.tabungan)) DATA.tabungan=[];

      if(!DATA.arisan || typeof DATA.arisan!=='object'){
        DATA.arisan={contribution:0,order:[],rounds:[]};
      }

      if(!Array.isArray(DATA.arisan.order)) DATA.arisan.order=[];
      if(!Array.isArray(DATA.arisan.rounds)) DATA.arisan.rounds=[];
      DATA.arisan.contribution=Number(DATA.arisan.contribution)||0;

      return true;

    }catch(err){
      console.error('Supabase load error:',err);

      DATA=defaultData();

      showDataError(
        'Data belum dapat dimuat dari Supabase. '+
        (err?.message || 'Periksa tabel app_data dan policy SELECT.')
      );

      return false;
    }
  }

  async function saveData(){
    if(!isAdmin){
      alert('Hanya Admin yang dapat mengubah data.');
      return false;
    }

    try{
      const {error}=await supabaseClient
        .from('app_data')
        .upsert(
          {
            id:APP_DATA_ID,
            data:DATA,
            updated_at:new Date().toISOString()
          },
          {onConflict:'id'}
        );

      if(error) throw error;

      return true;

    }catch(err){
      console.error('Supabase save error:',err);
      alert('Data gagal disimpan ke Supabase: '+(err?.message || 'Kesalahan tidak diketahui.'));
      return false;
    }
  }

  function showDataError(msg){
    const main=document.getElementById('main');
    if(main){
      main.innerHTML=`
        <div class="card">
          <h2>Koneksi Data</h2>
          <div class="empty">${escapeHtml(msg)}</div>
          <button class="btn gold block" id="retryData" style="margin-top:10px;">
            Coba Lagi
          </button>
        </div>`;
      document.getElementById('retryData')?.addEventListener('click',async()=>{
        await loadData();
        render();
      });
    }
  }

  // ---------- KAS ----------
  function kasTotal(){return DATA.kas.reduce((s,t)=>s+(t.type==='masuk'?t.amount:-t.amount),0);}
  function kasMasukBulanIni(){
    const ym=todayStr().slice(0,7);
    return DATA.kas.filter(t=>t.type==='masuk'&&t.date.slice(0,7)===ym).reduce((s,t)=>s+t.amount,0);
  }
  function kasKeluarBulanIni(){
    const ym=todayStr().slice(0,7);
    return DATA.kas.filter(t=>t.type==='keluar'&&t.date.slice(0,7)===ym).reduce((s,t)=>s+t.amount,0);
  }

  // ---------- TABUNGAN ----------
  function tabunganBalance(memberId){
    return DATA.tabungan.filter(t=>t.memberId===memberId).reduce((s,t)=>s+(t.type==='setor'?t.amount:-t.amount),0);
  }
  function tabunganTotal(){return DATA.tabungan.reduce((s,t)=>s+(t.type==='setor'?t.amount:-t.amount),0);}

  // ---------- ARISAN ----------
  function arisanCollectedThisRound(round){
    return Object.values(round.payments||{}).filter(Boolean).length*DATA.arisan.contribution;
  }
  function memberName(id){
    const m=DATA.members.find(m=>m.id===id);
    return m?m.name:'—';
  }

  // ================= RENDER =================
  function render(){
    if(!DATA) return;
    const main=document.getElementById('main');
    if(currentTab==='ringkasan') main.innerHTML=renderRingkasan();
    else if(currentTab==='kas') main.innerHTML=renderKas();

    else if(currentTab==='arisan') main.innerHTML=renderArisan();
    else if(currentTab==='anggota') main.innerHTML=renderAnggota();
    attachHandlers();
  }

  async function startNewRound(){
    if(!isAdmin)return;
    const a=DATA.arisan;
    if(a.order.length===0){alert('Atur urutan giliran dulu.');return;}
    const doneIds=new Set(a.rounds.filter(r=>r.completed).map(r=>r.memberId));
    const next=a.order.find(id=>!doneIds.has(id));
    if(!next){alert('Semua anggota sudah mendapat giliran.');return;}
    a.rounds.push({id:uid(),roundNumber:a.rounds.length+1,memberId:next,date:todayStr(),payments:Object.fromEntries(a.order.map(id=>[id,false])),completed:false});
    if(await saveData())render();
  }

  function sheetOpenRound(roundId){
    if(!isAdmin)return;
    const r=DATA.arisan.rounds.find(x=>x.id===roundId);
    if(!r)return;

    openSheet(`<h3>Putaran #${r.roundNumber} · ${escapeHtml(memberName(r.memberId))}</h3>
      <div class="field">
        <label>Penerima Arisan</label>
        <select id="roundMember">
          ${DATA.arisan.order.map(id=>`<option value="${id}" ${id===r.memberId?'selected':''}>${escapeHtml(memberName(id))}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Tanggal Putaran</label>
        <input type="date" id="roundDate" value="${r.date||todayStr()}">
      </div>
      <p style="font-size:12.5px;color:var(--muted);margin:0 0 10px;">Tandai anggota yang sudah membayar iuran.</p>
      <div id="paymentsList">
        ${DATA.arisan.order.map(id=>`<div class="pay-chip">
          <span>${escapeHtml(memberName(id))}</span>
          <button class="toggle ${r.payments[id]?'on':''}" data-toggle-pay="${id}" type="button"><span class="dot"></span></button>
        </div>`).join('')}
      </div>
      <div class="sheet-actions">
        <button class="btn ghost" id="saveRound">Simpan Perubahan</button>
        ${r.completed?'':`<button class="btn gold" id="markComplete">Tandai Selesai</button>`}
      </div>
      ${r.completed?'<div class="shared-note">Putaran ini sudah selesai. Masih dapat diedit oleh Admin.</div>':''}`);

    document.querySelectorAll('[data-toggle-pay]').forEach(btn=>btn.addEventListener('click',()=>{
      const id=btn.dataset.togglePay;
      r.payments[id]=!r.payments[id];
      btn.classList.toggle('on',r.payments[id]);
    }));

    document.getElementById('saveRound').addEventListener('click',async()=>{
      r.memberId=document.getElementById('roundMember').value;
      r.date=document.getElementById('roundDate').value||todayStr();
      if(await saveData()){closeSheet();render();}
    });

    document.getElementById('markComplete')?.addEventListener('click',async()=>{
      r.completed=true;
      if(await saveData()){closeSheet();render();}
    });
  }

  async function deleteArisanRound(id){
    if(!isAdmin){alert('Hanya Admin yang dapat menghapus putaran arisan.');return;}
    const idx=DATA.arisan.rounds.findIndex(r=>r.id===id);
    if(idx<0){alert('Putaran tidak ditemukan.');return;}
    const r=DATA.arisan.rounds[idx];
    if(!confirm(`Hapus Putaran #${r.roundNumber} (${memberName(r.memberId)}) beserta catatan pembayarannya?`))return;

    const backup=DATA.arisan.rounds[idx];
    DATA.arisan.rounds.splice(idx,1);

    // Renumber remaining rounds so the history stays clean.
    DATA.arisan.rounds
      .sort((a,b)=>String(a.date).localeCompare(String(b.date)) || Number(a.roundNumber)-Number(b.roundNumber))
      .forEach((round,i)=>round.roundNumber=i+1);

    if(!(await saveData())){
      DATA.arisan.rounds.splice(idx,0,backup);
      return;
    }
    render();
  }

  // ================= EVENTS =================
  function attachHandlers(){
    document.getElementById('btnAddMember')?.addEventListener('click',sheetAddMember);
    document.getElementById('btnEditContribution')?.addEventListener('click',sheetEditContribution);
    document.getElementById('btnEditOrder')?.addEventListener('click',sheetEditOrder);
    document.getElementById('btnStartRound')?.addEventListener('click',startNewRound);

    document.querySelectorAll('[data-edit-kas]').forEach(btn=>btn.addEventListener('click',()=>sheetEditKas(btn.dataset.editKas)));
    document.querySelectorAll('[data-del-kas]').forEach(btn=>btn.addEventListener('click',()=>deleteKas(btn.dataset.delKas)));

    document.querySelectorAll('[data-edit-tabungan]').forEach(btn=>btn.addEventListener('click',()=>sheetEditTabungan(btn.dataset.editTabungan)));
    document.querySelectorAll('[data-del-tabungan]').forEach(btn=>btn.addEventListener('click',()=>deleteTabungan(btn.dataset.delTabungan)));

    document.querySelectorAll('[data-edit-member]').forEach(btn=>btn.addEventListener('click',()=>sheetEditMember(btn.dataset.editMember)));

    document.querySelectorAll('[data-del-member]').forEach(btn=>btn.addEventListener('click',async()=>{
      if(!isAdmin)return;
      if(!confirm('Hapus anggota ini? Riwayat terkait tetap tersimpan.'))return;
      DATA.members=DATA.members.filter(m=>m.id!==btn.dataset.delMember);
      if(await saveData())render();
    }));

    document.querySelectorAll('[data-open-round]').forEach(el=>el.addEventListener('click',()=>sheetOpenRound(el.dataset.openRound)));
    document.querySelectorAll('[data-del-round]').forEach(btn=>btn.addEventListener('click',()=>deleteArisanRound(btn.dataset.delRound)));
  }

  document.querySelectorAll('nav.tabbar button').forEach(btn=>btn.addEventListener('click',()=>{
    document.querySelectorAll('nav.tabbar button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');currentTab=btn.dataset.tab;render();
  }));

  document.getElementById('fab').addEventListener('click',()=>{
    if(!isAdmin)return;
    if(currentTab==='tabungan')sheetAddTabungan();
    else if(currentTab==='anggota')sheetAddMember();
    else sheetAddKas();
  });

  // ================= INIT =================
  (async function init(){
    const main=document.getElementById('main');

    try{
      if(main){
        main.innerHTML='<div class="loading">Menghubungkan ke Supabase…</div>';
      }

      await refreshAuth();
      await loadData();
      render();

      // Do not await Supabase queries directly inside the auth callback.
      // A small timeout prevents event/callback races with getSession().
      supabaseClient.auth.onAuthStateChange(()=>{
        setTimeout(async()=>{
          await refreshAuth();
          if(!DATA) await loadData();
          render();
        },0);
      });

    }catch(err){
      console.error('Initialization error:',err);
      DATA=defaultData();

      if(main){
        main.innerHTML=`
          <div class="card">
            <h2>Gagal Memulai Aplikasi</h2>
            <div class="empty">${escapeHtml(err?.message || 'Terjadi kesalahan saat memulai aplikasi.')}</div>
            <button class="btn gold block" style="margin-top:10px;" onclick="location.reload()">
              Muat Ulang
            </button>
          </div>`;
      }
    }
  })();

</script>
</body>
</html>
