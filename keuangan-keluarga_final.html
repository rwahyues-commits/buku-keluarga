<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Buku Keluarga</title>

  <meta name="theme-color" content="#28374d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Buku Keluarga">
  <meta name="description" content="Buku Keluarga — Kas, Tabungan, dan Arisan Keluarga dalam satu aplikasi.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Buku Keluarga">
  <meta property="og:description" content="Kelola kas, tabungan, dan arisan keluarga dengan mudah dan transparan.">
  <meta property="og:site_name" content="Buku Keluarga">
  <meta name="twitter:card" content="summary">

<style>
  :root{
    --ink:#20281f;
    --paper:#f6f1e4;
    --paper-line:#e2d6b8;
    --gold:#b8862f;
    --gold-deep:#8c631f;
    --indigo:#28374d;
    --maroon:#7a2e2e;
    --green:#3c5a3e;
    --green-light:#eef1e6;
    --card:#fffdf7;
    --muted:#6f6a58;
    --danger:#a13e3e;
    --radius:14px;
    --shadow:0 2px 10px rgba(32,40,31,.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--paper);
    background-image:
      repeating-linear-gradient(180deg, transparent, transparent 27px, var(--paper-line) 28px);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:84px;
  }
  .display{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;}
  .mono{font-variant-numeric:tabular-nums;font-family:"SF Mono",Menlo,Consolas,monospace;}

  header{
    padding:22px 20px 14px;
    position:sticky;top:0;z-index:5;
    background:linear-gradient(180deg, var(--paper) 78%, transparent);
  }
  header .brand{display:flex;align-items:baseline;gap:8px;}
  header .brand .mark{
    width:34px;height:34px;border-radius:8px;
    background:var(--indigo);color:var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:Georgia,serif;font-weight:700;font-size:16px;
    box-shadow:var(--shadow);
    flex-shrink:0;
  }
  header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.2px;}
  header p.tag{margin:2px 0 0;color:var(--muted);font-size:12.5px;}

  main{padding:6px 16px 20px;max-width:640px;margin:0 auto;}

  .card{
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px;
    margin-bottom:14px;
  }
  .card h2{
    font-size:12px;text-transform:uppercase;letter-spacing:1px;
    color:var(--gold-deep);margin:0 0 10px;font-weight:700;
  }

  .balance-hero{
    background:var(--indigo);
    color:var(--paper);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:14px;
    position:relative;
    overflow:hidden;
  }
  .balance-hero::after{
    content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;
    border:1px solid rgba(184,134,47,.35);border-radius:50%;
  }
  .balance-hero::before{
    content:"";position:absolute;right:10px;bottom:-40px;width:90px;height:90px;
    border:1px solid rgba(184,134,47,.25);border-radius:50%;
  }
  .balance-hero .label{font-size:12px;color:#c9d3e0;text-transform:uppercase;letter-spacing:1.2px;}
  .balance-hero .amount{font-family:Georgia,serif;font-size:32px;font-weight:700;margin-top:4px;color:#fdf8ec;}
  .balance-hero .grid{display:flex;gap:18px;margin-top:16px;position:relative;z-index:1;}
  .balance-hero .grid div{flex:1;}
  .balance-hero .grid .k{font-size:10.5px;color:#a9b6c9;text-transform:uppercase;letter-spacing:.8px;}
  .balance-hero .grid .v{font-family:Georgia,serif;font-size:17px;margin-top:2px;color:#fdf8ec;}

  .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--paper-line);}
  .row:last-child{border-bottom:none;}
  .row .left{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .row .left .t{font-weight:600;font-size:14.5px;}
  .row .left .s{font-size:12px;color:var(--muted);}
  .row .amt{font-weight:700;font-size:14.5px;white-space:nowrap;padding-left:10px;}
  .amt.in{color:var(--green);}
  .amt.out{color:var(--danger);}
  .empty{color:var(--muted);font-size:13px;padding:14px 0;text-align:center;}

  .pill{
    display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;
    background:var(--green-light);color:var(--green);font-weight:600;
  }
  .pill.due{background:#f6e6d8;color:var(--gold-deep);}

  button{font-family:inherit;cursor:pointer;}
  .btn{
    background:var(--indigo);color:var(--paper);border:none;border-radius:10px;
    padding:11px 16px;font-size:14px;font-weight:600;
  }
  .btn.gold{background:var(--gold);color:#2b1e08;}
  .btn.ghost{background:transparent;color:var(--indigo);border:1px solid var(--indigo);}
  .btn.small{padding:7px 12px;font-size:12.5px;border-radius:8px;}
  .btn.block{width:100%;}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}

  .fab{
    position:fixed;right:18px;bottom:96px;z-index:20;
    width:54px;height:54px;border-radius:50%;
    background:var(--gold);color:#2b1e08;border:none;
    font-size:26px;box-shadow:0 4px 14px rgba(140,99,31,.4);
    display:flex;align-items:center;justify-content:center;
  }

  nav.tabbar{
    position:fixed;bottom:0;left:0;right:0;z-index:15;
    background:var(--card);border-top:1px solid var(--paper-line);
    display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  nav.tabbar button{
    flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--muted);font-size:10.5px;padding:6px 2px;border-radius:10px;
  }
  nav.tabbar button.active{color:var(--indigo);font-weight:700;background:var(--green-light);}
  nav.tabbar button .ic{font-size:18px;}

  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;}
  .field input, .field select, .field textarea{
    width:100%;padding:10px 12px;border:1px solid var(--paper-line);border-radius:9px;
    font-size:15px;background:#fffefb;color:var(--ink);font-family:inherit;
  }
  .seg{display:flex;border:1px solid var(--paper-line);border-radius:9px;overflow:hidden;}
  .seg button{flex:1;padding:10px;background:#fffefb;border:none;font-size:13.5px;font-weight:600;color:var(--muted);}
  .seg button.on.in{background:var(--green-light);color:var(--green);}
  .seg button.on.out{background:#f7e9e9;color:var(--danger);}

  .sheet-overlay{
    position:fixed;inset:0;background:rgba(32,40,31,.45);z-index:30;
    display:flex;align-items:flex-end;
  }
  .sheet{
    background:var(--paper);width:100%;border-radius:20px 20px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    max-height:88vh;overflow-y:auto;
    animation:up .18s ease-out;
  }
  @keyframes up{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
  .sheet h3{margin:0 0 14px;font-family:Georgia,serif;font-size:19px;}
  .sheet-actions{display:flex;gap:10px;margin-top:6px;}
  .sheet-actions .btn{flex:1;}
  .close-x{position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;color:var(--muted);}

  .member-chip{
    display:inline-flex;align-items:center;gap:6px;background:var(--green-light);color:var(--green);
    padding:5px 10px;border-radius:20px;font-size:12.5px;font-weight:600;margin:0 6px 6px 0;
  }
  .avatar{
    width:32px;height:32px;border-radius:50%;background:var(--gold);color:#2b1e08;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;
  }
  .member-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--paper-line);}
  .member-row:last-child{border-bottom:none;}
  .member-row .info{flex:1;min-width:0;}
  .member-row .info .n{font-weight:600;font-size:14.5px;}
  .member-row .info .b{font-size:12.5px;color:var(--muted);}

  .loading{display:flex;align-items:center;justify-content:center;padding:60px 0;color:var(--muted);font-size:13px;}
  .shared-note{font-size:11.5px;color:var(--muted);text-align:center;margin:4px 0 14px;}
  .auth-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;padding:9px 12px;background:var(--card);border:1px solid var(--paper-line);border-radius:10px;font-size:12px;}
  .auth-status{font-weight:700;color:var(--green);}
  .auth-status.viewer{color:var(--muted);}
  .auth-actions{display:flex;gap:6px;}
  .hidden-edit{display:none!important;}

  .arisan-order{display:flex;overflow-x:auto;gap:10px;padding:4px 2px 10px;}
  .arisan-order .stop{
    flex-shrink:0;width:88px;text-align:center;background:var(--card);border:1px solid var(--paper-line);
    border-radius:12px;padding:10px 6px;
  }
  .arisan-order .stop.done{background:var(--green-light);border-color:var(--green);}
  .arisan-order .stop .num{font-size:10px;color:var(--muted);}
  .arisan-order .stop .nm{font-size:12.5px;font-weight:700;margin-top:3px;}
  .arisan-order .stop .st{font-size:10px;margin-top:4px;}

  .pay-chip{
    display:flex;align-items:center;justify-content:space-between;background:#fffefb;
    border:1px solid var(--paper-line);border-radius:9px;padding:8px 10px;margin-bottom:6px;font-size:13px;
  }
  .toggle{
    width:38px;height:22px;border-radius:20px;background:#e2d6b8;position:relative;border:none;flex-shrink:0;
  }
  .toggle.on{background:var(--green);}
  .toggle .dot{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;}
  .toggle.on .dot{left:18px;}

  select#arisanTargetMonth, .filter-select{
    padding:8px 10px;border:1px solid var(--paper-line);border-radius:8px;font-size:12.5px;background:#fffefb;
  }

  .welcome-screen{
    position:fixed;inset:0;z-index:100;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    background:
      radial-gradient(circle at 85% 15%, rgba(184,134,47,.22), transparent 28%),
      linear-gradient(145deg,#28374d 0%,#20281f 100%);
    color:#fdf8ec;
  }
  .welcome-card{
    width:min(430px,100%);
    text-align:center;
    padding:34px 24px 26px;
    border:1px solid rgba(255,255,255,.14);
    border-radius:26px;
    background:rgba(255,253,247,.08);
    backdrop-filter:blur(14px);
    box-shadow:0 20px 60px rgba(0,0,0,.28);
  }
  .welcome-mark{
    width:74px;height:74px;margin:0 auto 16px;border-radius:20px;
    display:flex;align-items:center;justify-content:center;
    background:#b8862f;color:#28374d;
    font:700 30px Georgia,serif;
    box-shadow:0 8px 24px rgba(0,0,0,.2);
  }
  .welcome-card h2{font:700 31px Georgia,serif;margin:0 0 7px;}
  .welcome-card p{margin:0;color:#dce2ea;line-height:1.55;font-size:14px;}
  .welcome-features{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:20px 0;}
  .welcome-feature{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.1);font-size:11.5px;}
  .welcome-enter{width:100%;margin-top:4px;padding:13px 16px;border:0;border-radius:12px;background:#b8862f;color:#2b1e08;font-weight:800;font-size:15px;}
  .welcome-sub{margin-top:12px!important;font-size:11px!important;color:#bfc9d6!important;}
  .wa-hint{display:none;margin-top:12px;padding:10px 12px;border-radius:10px;background:#eef1e6;color:#3c5a3e;font-size:11.5px;text-align:center;}
  @media (display-mode: standalone){ .wa-hint{display:none!important;} }

</style>
</head>
<body>


<div class="welcome-screen" id="welcomeScreen">
  <div class="welcome-card">
    <div class="welcome-mark">BK</div>
    <h2>Buku Keluarga</h2>
    <p>Kas · Tabungan · Arisan</p>
    <div class="welcome-features">
      <span class="welcome-feature">💰 Keuangan</span>
      <span class="welcome-feature">👨‍👩‍👧‍👦 Keluarga</span>
      <span class="welcome-feature">📊 Transparan</span>
    </div>
    <p>Semua catatan keuangan keluarga dalam satu tempat.</p>
    <button class="welcome-enter" id="enterApp">Buka Buku Keluarga</button>
    <p class="welcome-sub">Dapat dibuka dari iPhone, Android, tablet, maupun komputer.</p>
  </div>
</div>

<header>
  <div class="brand">
    <div class="mark">BK</div>
    <div>
      <h1>Buku Keluarga</h1>
      <p class="tag">Kas · Tabungan · Arisan · Mode bersama</p>
    </div>
  </div>
</header>

<main id="main">
  <div class="loading">Memuat data…</div>
</main>

<button class="fab" id="fab">+</button>

<nav class="tabbar">
  <button data-tab="ringkasan" class="active"><span class="ic">🏠</span>Ringkasan</button>
  <button data-tab="kas"><span class="ic">📒</span>Kas</button>
  <button data-tab="tabungan"><span class="ic">🐖</span>Tabungan</button>
  <button data-tab="arisan"><span class="ic">🔄</span>Arisan</button>
  <button data-tab="anggota"><span class="ic">👪</span>Anggota</button>
</nav>

<div id="sheetRoot"></div>

<script>
const STORAGE_KEY = 'buku-keluarga-data';
let DATA = null;
let currentTab = 'ringkasan';
let IS_ADMIN = false;
const ADMIN_PASSWORD = '123456'; // Ganti password admin di sini sebelum dibagikan.
const AUTH_KEY = 'buku-keluarga-admin-session';

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function rupiah(n){
  n = Number(n)||0;
  return 'Rp' + n.toLocaleString('id-ID');
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){
  try{
    return new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
  }catch(e){ return d; }
}
function initials(name){
  return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
}


function isAdmin(){ return IS_ADMIN === true; }

function showAuthBar(){
  const main = document.getElementById('main');
  if(!main) return;
  const old = document.getElementById('authBar');
  if(old) old.remove();
  const bar = document.createElement('div');
  bar.id = 'authBar';
  bar.className = 'auth-bar';
  bar.innerHTML = `
    <span class="auth-status ${isAdmin()?'':'viewer'}">
      ${isAdmin() ? '🔐 Admin aktif' : '👁️ Mode lihat saja'}
    </span>
    <span class="auth-actions">
      ${isAdmin()
        ? '<button class="btn ghost small" id="logoutAdmin">Keluar Admin</button>'
        : '<button class="btn small" id="loginAdmin">Login Admin</button>'}
    </span>`;
  main.prepend(bar);
  document.getElementById('loginAdmin')?.addEventListener('click', loginAdmin);
  document.getElementById('logoutAdmin')?.addEventListener('click', logoutAdmin);
}

function loginAdmin(){
  const password = prompt('Masukkan password admin:');
  if(password === null) return;
  if(password !== ADMIN_PASSWORD){
    alert('Password admin salah.');
    return;
  }
  IS_ADMIN = true;
  try{ sessionStorage.setItem(AUTH_KEY, '1'); }catch(e){}
  render();
}

function logoutAdmin(){
  IS_ADMIN = false;
  try{ sessionStorage.removeItem(AUTH_KEY); }catch(e){}
  closeSheet();
  render();
}

function requireAdmin(){
  if(!isAdmin()){
    alert('Akses ditolak. Hanya admin yang dapat mengubah data.');
    return false;
  }
  return true;
}

function applyViewerMode(){
  // Tombol tambah/edit/hapus disembunyikan untuk pengguna biasa.
  document.getElementById('fab')?.classList.toggle('hidden-edit', !isAdmin());
  document.querySelectorAll('[data-admin-only]').forEach(el=>{
    el.classList.toggle('hidden-edit', !isAdmin());
  });
}

function defaultData(){
  return {
    members: [],
    kas: [],
    tabungan: [],
    arisan: { contribution: 0, order: [], rounds: [] }
  };
}

async function loadData(){
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    DATA = res && res.value ? JSON.parse(res.value) : defaultData();
  }catch(e){
    DATA = defaultData();
  }
  if(!DATA.arisan) DATA.arisan = { contribution:0, order:[], rounds:[] };
}

async function saveData(){
  try{
    const result = await window.storage.set(STORAGE_KEY, JSON.stringify(DATA), true);
    if(!result){ console.error('Gagal menyimpan data'); }
  }catch(e){ console.error('Storage error', e); }
}

function memberName(id){
  const m = DATA.members.find(m=>m.id===id);
  return m ? m.name : '—';
}

// ---------- KAS ----------
function kasTotal(){
  return DATA.kas.reduce((s,t)=> s + (t.type==='masuk'? t.amount : -t.amount), 0);
}
function kasMasukBulanIni(){
  const ym = todayStr().slice(0,7);
  return DATA.kas.filter(t=>t.type==='masuk' && t.date.slice(0,7)===ym).reduce((s,t)=>s+t.amount,0);
}
function kasKeluarBulanIni(){
  const ym = todayStr().slice(0,7);
  return DATA.kas.filter(t=>t.type==='keluar' && t.date.slice(0,7)===ym).reduce((s,t)=>s+t.amount,0);
}

// ---------- TABUNGAN ----------
function tabunganBalance(memberId){
  return DATA.tabungan.filter(t=>t.memberId===memberId)
    .reduce((s,t)=> s + (t.type==='setor'? t.amount : -t.amount), 0);
}
function tabunganTotal(){
  return DATA.tabungan.reduce((s,t)=> s + (t.type==='setor'? t.amount : -t.amount), 0);
}

// ---------- ARISAN ----------
function arisanCollectedThisRound(round){
  return Object.values(round.payments||{}).filter(Boolean).length * DATA.arisan.contribution;
}

// ================= RENDER =================
function render(){
  const main = document.getElementById('main');
  if(currentTab==='ringkasan') main.innerHTML = renderRingkasan();
  else if(currentTab==='kas') main.innerHTML = renderKas();
  else if(currentTab==='tabungan') main.innerHTML = renderTabungan();
  else if(currentTab==='arisan') main.innerHTML = renderArisan();
  else if(currentTab==='anggota') main.innerHTML = renderAnggota();
  attachHandlers();
  showAuthBar();
  applyViewerMode();
}

function renderRingkasan(){
  const totalKas = kasTotal();
  const totalTabungan = tabunganTotal();
  const lastKas = [...DATA.kas].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4);
  return `
    <div class="balance-hero">
      <div class="label">Total Kas Keluarga</div>
      <div class="amount">${rupiah(totalKas)}</div>
      <div class="grid">
        <div><div class="k">Masuk bulan ini</div><div class="v">${rupiah(kasMasukBulanIni())}</div></div>
        <div><div class="k">Keluar bulan ini</div><div class="v">${rupiah(kasKeluarBulanIni())}</div></div>
      </div>
    </div>
    <div class="card">
      <h2>Total Tabungan Keluarga</h2>
      <div style="font-family:Georgia,serif;font-size:24px;font-weight:700;color:var(--green);">${rupiah(totalTabungan)}</div>
      <p style="font-size:12.5px;color:var(--muted);margin:4px 0 0;">${DATA.members.length} anggota tercatat</p>
    </div>
    <div class="card">
      <h2>Mutasi Kas Terbaru</h2>
      ${lastKas.length? lastKas.map(t=>`
        <div class="row">
          <div class="left"><span class="t">${escapeHtml(t.category||'-')}</span><span class="s">${fmtDate(t.date)}${t.note? ' · '+escapeHtml(t.note):''}</span></div>
          <div class="amt ${t.type==='masuk'?'in':'out'}">${t.type==='masuk'?'+':'-'}${rupiah(t.amount)}</div>
        </div>`).join('') : '<div class="empty">Belum ada transaksi kas.</div>'}
    </div>
    ${renderArisanReminderCard()}
  `;
}

function renderArisanReminderCard(){
  const rounds = DATA.arisan.rounds;
  const active = rounds.find(r=>!r.completed);
  if(!active) return '';
  const collected = arisanCollectedThisRound(active);
  const target = DATA.arisan.contribution * DATA.arisan.order.length;
  return `
    <div class="card">
      <h2>Arisan Giliran Berjalan</h2>
      <div class="row">
        <div class="left"><span class="t">Penerima: ${escapeHtml(memberName(active.memberId))}</span><span class="s">Putaran #${active.roundNumber}</span></div>
        <div class="amt in">${rupiah(collected)} / ${rupiah(target)}</div>
      </div>
    </div>
  `;
}

function renderKas(){
  const filterHtml = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;">
      <h2 style="margin:0;">Semua Transaksi</h2>
    </div>`;
  const list = [...DATA.kas].sort((a,b)=>b.date.localeCompare(a.date));
  return `
    <div class="card">
      ${filterHtml}
      ${list.length? list.map(t=>`
        <div class="row">
          <div class="left"><span class="t">${escapeHtml(t.category||'-')}</span><span class="s">${fmtDate(t.date)}${t.note? ' · '+escapeHtml(t.note):''}</span></div>
          <div class="amt ${t.type==='masuk'?'in':'out'}">${t.type==='masuk'?'+':'-'}${rupiah(t.amount)}</div>
        </div>`).join('') : '<div class="empty">Belum ada transaksi. Tekan tombol + untuk menambah.</div>'}
    </div>
  `;
}

function renderTabungan(){
  if(DATA.members.length===0){
    return `<div class="card"><div class="empty">Tambahkan anggota keluarga dulu di tab Anggota.</div></div>`;
  }
  return `
    <div class="card">
      <h2>Saldo per Anggota</h2>
      ${DATA.members.map(m=>{
        const bal = tabunganBalance(m.id);
        return `<div class="member-row">
          <div class="avatar">${initials(m.name)}</div>
          <div class="info"><div class="n">${escapeHtml(m.name)}</div><div class="b">${rupiah(bal)}</div></div>

      }).join('')}
    </div>
    <div class="card">
      <h2>Riwayat Setor/Tarik</h2>
      ${DATA.tabungan.length? [...DATA.tabungan].sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`
        <div class="row">
          <div class="left"><span class="t">${escapeHtml(memberName(t.memberId))}</span><span class="s">${fmtDate(t.date)}${t.note? ' · '+escapeHtml(t.note):''}</span></div>
          <div class="amt ${t.type==='setor'?'in':'out'}">${t.type==='setor'?'+':'-'}${rupiah(t.amount)}</div>

function renderArisan(){
  const a = DATA.arisan;
  if(DATA.members.length===0){
    return `<div class="card"><div class="empty">Tambahkan anggota keluarga dulu di tab Anggota.</div></div>`;
  }
  const orderNames = a.order.map(id=>memberName(id));
  return `
    <div class="card">
      <h2>Pengaturan Arisan</h2>
      <div class="row">
        <div class="left"><span class="t">Iuran per giliran</span><span class="s">Per anggota, per putaran</span></div>
        <div class="amt in">${rupiah(a.contribution)}</div>
      </div>
      <button data-admin-only class="btn ghost small" id="btnEditContribution" style="margin-top:8px;">Ubah Iuran</button>
      <button data-admin-only class="btn ghost small" id="btnEditOrder" style="margin-top:8px;margin-left:8px;">Atur Urutan (${a.order.length} orang)</button>
    </div>

    ${a.order.length===0 ? `<div class="card"><div class="empty">Atur urutan giliran arisan terlebih dahulu.</div></div>` : `
    <div class="card">
      <h2>Urutan Giliran</h2>
      <div class="arisan-order">
        ${a.order.map((id,i)=>{
          const done = a.rounds.some(r=>r.memberId===id && r.completed);
          return `<div class="stop ${done?'done':''}">
            <div class="num">#${i+1}</div>
            <div class="nm">${escapeHtml(memberName(id))}</div>
            <div class="st">${done? '✓ Selesai' : '–'}</div>
          </div>`;
        }).join('')}
      </div>
      <button data-admin-only class="btn gold block" id="btnStartRound" style="margin-top:6px;">Mulai Putaran Baru</button>
    </div>`}

    <div class="card">
      <h2>Riwayat Putaran</h2>
      ${a.rounds.length? [...a.rounds].sort((x,y)=>y.roundNumber-x.roundNumber).map(r=>{
        const collected = arisanCollectedThisRound(r);
        const target = a.contribution * a.order.length;
        return `
        <div class="row" style="align-items:flex-start;cursor:pointer;" data-open-round="${r.id}">
          <div class="left">
            <span class="t">Putaran #${r.roundNumber} · ${escapeHtml(memberName(r.memberId))}</span>
            <span class="s">${fmtDate(r.date)} · ${r.completed? '<span class=\"pill\">Selesai</span>' : '<span class=\"pill due\">Berjalan</span>'}</span>
          </div>
          <div class="amt in">${rupiah(collected)}/${rupiah(target)}</div>
        </div>`;
      }).join('') : '<div class="empty">Belum ada putaran arisan.</div>'}
    </div>
  `;
}

function renderAnggota(){
  return `
    <div class="card">
      <h2>Anggota Keluarga</h2>
      ${DATA.members.length? DATA.members.map(m=>`
        <div class="member-row">
          <div class="avatar">${initials(m.name)}</div>
          <div class="info"><div class="n">${escapeHtml(m.name)}</div><div class="b">Tabungan: ${rupiah(tabunganBalance(m.id))}</div></div>
          <button data-admin-only class="btn danger small" data-del-member="${m.id}">Hapus</button>
        </div>`).join('') : '<div class="empty">Belum ada anggota.</div>'}
      <button data-admin-only class="btn block gold" id="btnAddMember" style="margin-top:12px;">+ Tambah Anggota</button>
    </div>
    <div class="shared-note">👁️ Data dapat dilihat bersama. Hanya admin yang dapat mengubahnya.</div>
  `;
}

function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ================= SHEETS (modals) =================
function openSheet(html){
  const root = document.getElementById('sheetRoot');
  root.innerHTML = `<div class="sheet-overlay" id="sheetOverlay"><div class="sheet" style="position:relative;">
    <button class="close-x" id="sheetClose">✕</button>${html}</div></div>`;
  document.getElementById('sheetOverlay').addEventListener('click', (e)=>{ if(e.target.id==='sheetOverlay') closeSheet(); });
  document.getElementById('sheetClose').addEventListener('click', closeSheet);
}
function closeSheet(){ document.getElementById('sheetRoot').innerHTML=''; }

function sheetAddKas(){
  if(!requireAdmin()) return;

  openSheet(`
    <h3>Tambah Transaksi Kas</h3>
    <div class="seg" id="kasTypeSeg">
      <button type="button" class="on in" data-val="masuk">Uang Masuk</button>
      <button type="button" data-val="keluar">Uang Keluar</button>
    </div>
    <div class="field" style="margin-top:12px;"><label>Jumlah (Rp)</label><input type="number" id="kasAmount" inputmode="numeric" placeholder="0"></div>
    <div class="field"><label>Kategori</label><input type="text" id="kasCategory" placeholder="mis. Belanja bulanan, Iuran, THR"></div>
    <div class="field"><label>Tanggal</label><input type="date" id="kasDate" value="${todayStr()}"></div>
    <div class="field"><label>Catatan (opsional)</label><input type="text" id="kasNote" placeholder="Catatan tambahan"></div>
    <div class="sheet-actions">
      <button class="btn ghost" id="cancelKas">Batal</button>
      <button class="btn gold" id="saveKas">Simpan</button>
    </div>
  `);
  let kasType = 'masuk';
  document.querySelectorAll('#kasTypeSeg button').forEach(b=>{
    b.addEventListener('click', ()=>{
      kasType = b.dataset.val;
      document.querySelectorAll('#kasTypeSeg button').forEach(x=>x.classList.remove('on','in','out'));
      b.classList.add('on', kasType==='masuk'?'in':'out');
    });
  });
  document.getElementById('cancelKas').addEventListener('click', closeSheet);
  document.getElementById('saveKas').addEventListener('click', async ()=>{
    const amount = Number(document.getElementById('kasAmount').value);
    const category = document.getElementById('kasCategory').value.trim();
    const date = document.getElementById('kasDate').value || todayStr();
    const note = document.getElementById('kasNote').value.trim();
    if(!amount || amount<=0){ alert('Isi jumlah yang valid'); return; }
    DATA.kas.push({id:uid(), type:kasType, amount, category: category||(kasType==='masuk'?'Pemasukan':'Pengeluaran'), date, note});
    await saveData();
    closeSheet(); render();
  });
}

function sheetAddTabungan(){
  if(!requireAdmin()) return;

  if(DATA.members.length===0){ alert('Tambahkan anggota keluarga dulu di tab Anggota.'); return; }
  openSheet(`
    <h3>Tambah Setor / Tarik Tabungan</h3>
    <div class="field"><label>Anggota</label>
      <select id="tbMember">${DATA.members.map(m=>`<option value="${m.id}">${escapeHtml(m.name)}</option>`).join('')}</select>
    </div>
    <div class="seg" id="tbTypeSeg">
      <button type="button" class="on in" data-val="setor">Setor</button>
      <button type="button" data-val="tarik">Tarik</button>
    </div>
    <div class="field" style="margin-top:12px;"><label>Jumlah (Rp)</label><input type="number" id="tbAmount" inputmode="numeric" placeholder="0"></div>
    <div class="field"><label>Tanggal</label><input type="date" id="tbDate" value="${todayStr()}"></div>
    <div class="field"><label>Catatan (opsional)</label><input type="text" id="tbNote" placeholder="Catatan tambahan"></div>
    <div class="sheet-actions">
      <button class="btn ghost" id="cancelTb">Batal</button>
      <button class="btn gold" id="saveTb">Simpan</button>

      b.classList.add('on', tbType==='setor'?'in':'out');

function sheetAddMember(){
  if(!requireAdmin()) return;

  openSheet(`
    <h3>Tambah Anggota Keluarga</h3>
    <div class="field"><label>Nama</label><input type="text" id="memberName" placeholder="mis. Ibu, Bapak, Kak Dinda"></div>
    <div class="sheet-actions">
      <button class="btn ghost" id="cancelMember">Batal</button>
      <button class="btn gold" id="saveMember">Simpan</button>
    </div>
  `);
  document.getElementById('cancelMember').addEventListener('click', closeSheet);
  document.getElementById('saveMember').addEventListener('click', async ()=>{
    const name = document.getElementById('memberName').value.trim();
    if(!name){ alert('Isi nama anggota'); return; }
    DATA.members.push({id:uid(), name});
    await saveData();
    closeSheet(); render();
  });

function sheetEditContribution(){
  if(!requireAdmin()) return;

  openSheet(`
    <h3>Ubah Iuran Arisan</h3>
    <div class="field"><label>Iuran per anggota per putaran (Rp)</label><input type="number" id="contribAmount" value="${DATA.arisan.contribution||''}" inputmode="numeric"></div>
    <div class="sheet-actions">
      <button class="btn ghost" id="cancelContrib">Batal</button>
      <button class="btn gold" id="saveContrib">Simpan</button>
    </div>
  `);
  document.getElementById('cancelContrib').addEventListener('click', closeSheet);
  document.getElementById('saveContrib').addEventListener('click', async ()=>{
    const val = Number(document.getElementById('contribAmount').value);
    DATA.arisan.contribution = val>0? val : 0;
    await saveData();
    closeSheet(); render();
  });
}

function sheetEditOrder(){
  if(!requireAdmin()) return;

  const selected = new Set(DATA.arisan.order);
  openSheet(`
    <h3>Atur Urutan Giliran</h3>
    <p style="font-size:12.5px;color:var(--muted);margin-top:-6px;">Pilih anggota sesuai urutan giliran menerima arisan (klik untuk menambah ke urutan).</p>
    <div id="orderPicker">
      ${DATA.members.map(m=>`<button type="button" class="member-chip" data-pick="${m.id}" style="${selected.has(m.id)?'':'opacity:.45'}">${escapeHtml(m.name)}</button>`).join('')}
    </div>
    <div class="field" style="margin-top:10px;"><label>Urutan saat ini</label>
      <div id="orderList" style="font-size:13px;color:var(--ink);">${DATA.arisan.order.map((id,i)=>`${i+1}. ${escapeHtml(memberName(id))}`).join('<br>')||'Belum ada'}</div>
    </div>
    <div class="sheet-actions">
      <button class="btn ghost" id="clearOrder">Kosongkan</button>
      <button class="btn gold" id="doneOrder">Selesai</button>
    </div>
  `);
  let order = [...DATA.arisan.order];
  function refreshList(){
    document.getElementById('orderList').innerHTML = order.map((id,i)=>`${i+1}. ${escapeHtml(memberName(id))}`).join('<br>') || 'Belum ada';
  }
  document.querySelectorAll('[data-pick]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.pick;
      const idx = order.indexOf(id);
      if(idx>=0){ order.splice(idx,1); btn.style.opacity='.45'; }
      else { order.push(id); btn.style.opacity='1'; }
      refreshList();
    });
  });
  document.getElementById('clearOrder').addEventListener('click', ()=>{ order=[]; document.querySelectorAll('[data-pick]').forEach(b=>b.style.opacity='.45'); refreshList(); });
  document.getElementById('doneOrder').addEventListener('click', async ()=>{
    DATA.arisan.order = order;
    await saveData();
    closeSheet(); render();
  });
}

async function startNewRound(){
  if(!requireAdmin()) return;

  const a = DATA.arisan;
  if(a.order.length===0){ alert('Atur urutan giliran dulu.'); return; }
  const doneIds = new Set(a.rounds.filter(r=>r.completed).map(r=>r.memberId));
  const next = a.order.find(id=>!doneIds.has(id));
  if(!next){ alert('Semua anggota sudah mendapat giliran. Kosongkan riwayat untuk mulai putaran baru dari awal.'); return; }
  const roundNumber = a.rounds.length + 1;
  const payments = {};
  a.order.forEach(id=>{ payments[id]=false; });
  a.rounds.push({ id:uid(), roundNumber, memberId: next, date: todayStr(), payments, completed:false });
  await saveData();
  render();
}

function sheetOpenRound(roundId){
  if(!requireAdmin()) return;

  const r = DATA.arisan.rounds.find(x=>x.id===roundId);
  if(!r) return;
  openSheet(`
    <h3>Putaran #${r.roundNumber} · ${escapeHtml(memberName(r.memberId))}</h3>
    <p style="font-size:12.5px;color:var(--muted);margin-top:-6px;">Tandai anggota yang sudah membayar iuran putaran ini.</p>
    <div id="paymentsList">
      ${DATA.arisan.order.map(id=>`
        <div class="pay-chip">
          <span>${escapeHtml(memberName(id))}</span>
          <button class="toggle ${r.payments[id]?'on':''}" data-toggle-pay="${id}"><span class="dot"></span></button>
        </div>`).join('')}
    </div>
    <div class="sheet-actions">
      ${r.completed? '' : `<button class="btn gold block" id="markComplete">Tandai Selesai</button>`}
    </div>
    ${r.completed? '<div class="shared-note">Putaran ini sudah selesai.</div>' : ''}
  `);
  document.querySelectorAll('[data-toggle-pay]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.togglePay;
      r.payments[id] = !r.payments[id];
      btn.classList.toggle('on', r.payments[id]);
      await saveData();
    });
  });
  const mc = document.getElementById('markComplete');
  if(mc) mc.addEventListener('click', async ()=>{
    r.completed = true;
    await saveData();
    closeSheet(); render();
  });
}

// ================= EVENTS =================
function attachHandlers(){
  document.getElementById('btnAddMember')?.addEventListener('click', sheetAddMember);
  document.getElementById('btnEditContribution')?.addEventListener('click', sheetEditContribution);
  document.getElementById('btnEditOrder')?.addEventListener('click', sheetEditOrder);
  document.getElementById('btnStartRound')?.addEventListener('click', startNewRound);
  document.querySelectorAll('[data-del-member]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!requireAdmin()) return;
      const id = btn.dataset.delMember;
      if(!confirm('Hapus anggota ini? Riwayat tabungan/arisan terkait tetap tersimpan.')) return;
      DATA.members = DATA.members.filter(m=>m.id!==id);
      await saveData();
      render();
    });
  });
  document.querySelectorAll('[data-open-round]').forEach(el=>{
    el.addEventListener('click', ()=> sheetOpenRound(el.dataset.openRound));
  });
}

document.querySelectorAll('nav.tabbar button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabbar button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    render();
  });
});

document.getElementById('fab').addEventListener('click', ()=>{
  if(!requireAdmin()) return;
  if(currentTab==='tabungan') sheetAddTabungan();
  else if(currentTab==='anggota') sheetAddMember();
  else sheetAddKas();
});

// ================= INIT =================
(async function init(){
  try{ IS_ADMIN = sessionStorage.getItem(AUTH_KEY) === '1'; }catch(e){ IS_ADMIN = false; }
  await loadData();
  render();
})();

function closeWelcome(){
  const screen = document.getElementById('welcomeScreen');
  if(screen){
    screen.style.opacity='0';
    screen.style.transition='opacity .22s ease';
    setTimeout(()=>screen.remove(),220);
  }
  try{ localStorage.setItem('buku-keluarga-welcome-seen','1'); }catch(e){}
}

document.getElementById('enterApp')?.addEventListener('click', closeWelcome);

(function(){
  try{
    if(localStorage.getItem('buku-keluarga-welcome-seen') === '1'){
      document.getElementById('welcomeScreen')?.remove();
    }
  }catch(e){}
})();

</script>
